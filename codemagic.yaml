workflows:
  ios-capacitor:
    name: MarktFuchs iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-de

      - name: Build web app
        script: |
          cd frontend
          npm run build

      - name: Add and sync iOS
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install

      - name: Build iOS
        script: |
          cd frontend
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - /tmp/xcodebuild_logs/*.log
