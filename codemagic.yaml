workflows:
  ios-capacitor:
    name: MarktFuchs iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Install Capacitor
        script: |
          cd frontend
          npm install @capacitor/core@8.5.2 @capacitor/cli@8.5.2 @capacitor/ios@8.5.2 --save --legacy-peer-deps

      - name: Build web app
        script: |
          cd frontend
          npm run build

      - name: Create Capacitor config
        script: |
          cd frontend
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.marktfuchs.app',
            appName: 'MarktFuchs',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Add iOS platform
        script: |
          cd frontend
          npx cap add ios

      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install

      - name: Build iOS app
        script: |
          cd frontend
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - frontend/ios/App/build/**/*.app
      - /tmp/xcodebuild_logs/*.log

